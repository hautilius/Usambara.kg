<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Usambara.kg</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #e91e63;
      --light-bg: #fdf7f9;
      --dark-text: #333;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
      background-color: var(--light-bg);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      position: relative;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      text-decoration: none;
      color: #888;
      font-size: 0.9rem;
      font-weight: 600;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .back-btn:hover { color: var(--primary-color); }

    .login-header { text-align: center; margin-bottom: 30px; }
    .login-header i { font-size: 3rem; color: var(--primary-color); margin-bottom: 15px; }
    .login-header h2 { color: var(--dark-text); }

    .input-group { margin-bottom: 20px; position: relative; }
    .input-group > i:not(.toggle-password) {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #ccc;
      z-index: 5;
    }

    .input-group input {
      width: 100%;
      padding: 12px 45px;
      border: 2px solid #eee;
      border-radius: 10px;
      outline: none;
      transition: 0.3s;
      font-size: 1rem;
    }

    .input-group input:focus { border-color: var(--primary-color); }

    .password-wrapper { position: relative; width: 100%; }
    .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #888;
      z-index: 10;
      transition: 0.3s;
    }
    .toggle-password:hover { color: var(--primary-color); }

    .btn-login {
      width: 100%;
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.3s;
    }
    .btn-login:hover { background: #d81b60; transform: translateY(-1px); }

    .error-msg {
      color: #ff4d4d;
      font-size: 0.9rem;
      margin-top: 15px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

<div class="login-card">
  <a href="index.html" class="back-btn">
    <i class="fa-solid fa-arrow-left"></i> Назад
  </a>

  <div class="login-header">
    <i class="fa-solid fa-circle-user"></i>
    <h2>Вход для админа</h2>
  </div>

  <form id="login-form">
    <div class="input-group">
      <i class="fa-solid fa-user"></i>
      <input type="text" id="username" placeholder="Логин" autocomplete="username" required>
    </div>

    <div class="input-group">
      <i class="fa-solid fa-key"></i>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Пароль" autocomplete="current-password" required>
        <i class="fa-solid fa-eye toggle-password" id="eye-icon"></i>
      </div>
    </div>

    <button type="submit" class="btn-login">Войти в систему</button>
    <p class="error-msg" id="error">Неверный логин или пароль</p>
  </form>
</div>

<script>
  // ИСПРАВЛЕНИЕ #5: учётные данные хранятся в хэшированном виде (SHA-256),
  // а не в открытом тексте. Для смены пароля — обновите хэш ниже.
  // Текущие данные: login=admin, pass=12345
  const VALID_CREDENTIALS = {
    // SHA-256 от "admin"
    user: '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918',
    // SHA-256 от "149869A"
    pass: 'ddcd46a21124eca06415a20d0abdd4946c1935dcbfaa5a1102385b6c300e145d'
  };

  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  const eyeIcon = document.getElementById('eye-icon');
  const passwordInput = document.getElementById('password');

  eyeIcon.addEventListener('click', () => {
    const isPassword = passwordInput.getAttribute('type') === 'password';
    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
    eyeIcon.classList.toggle('fa-eye');
    eyeIcon.classList.toggle('fa-eye-slash');
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const userVal = document.getElementById('username').value;
    const passVal = document.getElementById('password').value;

    const [userHash, passHash] = await Promise.all([sha256(userVal), sha256(passVal)]);

    if (userHash === VALID_CREDENTIALS.user && passHash === VALID_CREDENTIALS.pass) {
      localStorage.setItem('isAdmin', 'true');
      window.location.href = 'admin.html';
    } else {
      const errorLabel = document.getElementById('error');
      errorLabel.style.display = 'block';
      document.querySelector('.login-card').animate([
        { transform: 'translateX(-5px)' },
        { transform: 'translateX(5px)' },
        { transform: 'translateX(0)' }
      ], { duration: 200, iterations: 2 });
    }
  });
</script>

</body>
</html>
